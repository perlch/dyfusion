<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dyfusion-bin</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #000312;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        overflow: hidden;
        color: white;
    }

    .sphere-container {
        width: min(60vw, 60vh);
        height: min(60vw, 60vh);
        position: relative;
        perspective: 1000px;
        margin-bottom: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .sphere-rotator {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transform-origin: 50% 50% 0;
        animation: rotateSphere 12s linear infinite;
    }

    @keyframes rotateSphere {
        0%   { transform: rotateY(0deg) rotateX(0deg); }
        100% { transform: rotateY(360deg) rotateX(360deg); }
    }

    .sphere {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
    }

    .dot {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }

    .chat-box {
        width: 90vw;
        max-width: 600px;
        display: flex;
        gap: 10px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        backdrop-filter: blur(5px);
    }

    .chat-box input {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
    }

    .chat-box button {
        padding: 12px 20px;
        background: #0066ff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        color: white;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="sphere-container">
    <div class="sphere-rotator">
        <div class="sphere" id="sphere"></div>
    </div>
</div>

<div class="chat-box">
    <input id="userInput" placeholder="enter a message for learn dyfusion...">
    <button id="sendBtn">Send</button>
</div>

<script>
    const sphere = document.getElementById("sphere");
    const colors = ["red", "yellow", "lime", "cyan"];
    const dotsCount = 180;

    const size = sphere.offsetWidth;
    const radius = size / 2;

    for (let i = 0; i < dotsCount; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

        const phi = Math.acos(1 - 2 * (i + 0.5) / dotsCount);
        const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);

        dot.style.transform = `translate3d(${x + radius}px, ${y + radius}px, ${z}px)`;
        sphere.appendChild(dot);
    }

    const webhookURL = "https://discord.com/api/webhooks/1447612263107399763/sbdST_8PpgZXy768-cMWrAPLUv-7kjQOovMeuCWUIfchnbwVtHFPUUR6RLdsDfaCjlwM";

    document.getElementById("sendBtn").onclick = async () => {
        const text = document.getElementById("userInput").value.trim();
        if (!text) return;
        if (text.length <= 50) return;
        let maintext = `dyf: ${text}`
        await fetch(webhookURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: maintext })
        });

        document.getElementById("userInput").value = "";
    };
</script>


</body>
</html>
